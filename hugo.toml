baseURL = "https://Airopamgine.github.io/my-physics-lab/"
publishDir = "docs"
title = "Master's Physics Lab"
languageCode = "ja"
theme = "PaperMod"

[params]
  # 数式を使えるようにするスイッチ
  math = true
  [menu]
  [[menu.main]]
    identifier = "mechanics"
    name = "力学"
    url = "/categories/力学/"
    weight = 10

  [[menu.main]]
    identifier = "electromagnetism"
    name = "電磁気"
    url = "/categories/電磁気/"
    weight = 20

  [[menu.main]]
    identifier = "thermodynamics"
    name = "熱力学"
    url = "/categories/熱力学/"
    weight = 30

  [[menu.main]]
    identifier = "statistical"
    name = "統計力学"
    url = "/categories/統計力学/"
    weight = 40

  [[menu.main]]
    identifier = "quantum"
    name = "量子力学"
    url = "/categories/量子力学/"
    weight = 50

  [[menu.main]]
    identifier = "chemical-physics"
    name = "化学物理"
    url = "/categories/化学物理/"
    weight = 60

  [[menu.main]]
    identifier = "policy"
    name = "制作方針"
    url = "/policy/"
    weight = 90
# --- ここから下を追記 ---

[params.profileMode]
  enabled = true
  title = "Master's Physics Lab"
  subtitle = "学部物理・大学院入試準備のための独自演習教材"
  
  # 画像があればここにURLを入れられます（今はなくてOK）
  imageUrl = "" 
  imageWidth = 120
  imageHeight = 120

  # 表紙に置きたいボタン（例：GitHubへのリンクなど）
  [[params.profileMode.buttons]]
    name = "記事一覧へ"
    url = "/posts"

  [[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/Airopamgine"
# --- 以下の設定を一番下に追記してください ---

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # これを true にすると、Enterキーでの改行がそのまま反映されます
      hardWraps = true
      unsafe = true        

[caches]
  [caches.images]
    dir = ':cacheDir/images'
